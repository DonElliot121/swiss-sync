# Netlify-Konfiguration für Swiss Sync (Next.js 16)
# Das offizielle Next.js Runtime-Plugin übernimmt SSR, API-Routes
# (z.B. /api/contact) und dynamische Seiten automatisch.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 benötigt Node 20.9+
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
